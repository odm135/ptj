<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="description" content="入力した文字列を大きく表示するページ" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文字拡大表示</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- フォント候補（必要に応じて増減OK） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=M+PLUS+1p:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* 既存の body/header/theme 周りは触らず、縦レイアウト化だけ追加 */
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 上：横長・縦薄入力 + フォント選択 */
    .inputbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    #text {
      width: 100%;
      height: 56px;
      min-height: 56px;
      max-height: 120px;
      resize: none;

      padding: 10px 12px;
      font-size: 18px;
      line-height: 1.25;

      border-radius: 12px;
      border: 1px solid #D0D0D0;
      background: #FFFFFF;
      color: inherit;
      outline: none;
    }
    #text:focus { border-color: #888888; }
    body.dark #text {
      background: #181818;
      border-color: #444444;
    }

    #font {
      height: 56px;
      padding: 0 10px;
      border-radius: 12px;
      border: 1px solid #D0D0D0;
      background: #FFFFFF;
      color: inherit;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      white-space: nowrap;
    }
    body.dark #font {
      background: #181818;
      border-color: #444444;
    }

    /* 下：残り全部を出力に */
    .output-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    :root { --output-font: inherit; }

    #output {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      white-space: pre-wrap;
      word-break: break-word;

      border-radius: 16px;
      border: 1px dashed #D0D0D0;
      background: #FAFAFA;
      padding: 14px;

      font-family: var(--output-font);
      font-size: clamp(48px, 9vw, 240px);
      line-height: 1.02;
    }
    body.dark #output {
      background: #151515;
      border-color: #444444;
    }

    @media (max-width: 520px) {
      .inputbar { grid-template-columns: 1fr; }
      #font { height: 48px; }
      #output { font-size: clamp(40px, 12vw, 200px); }
    }
  </style>
</head>

<body>
  <!-- ヘッダー（既存の他ページと同じ構成・クラス想定） -->
  <header>
    <h1>文字拡大表示</h1>
    <div class="icons">
      <a href="./index.html" aria-label="トップへ" title="トップへ">
        <i class="fa-solid fa-house"></i>
      </a>
      <i id="theme" class="fa-regular fa-moon" aria-label="テーマ切替" title="テーマ切替"></i>
    </div>
  </header>

  <main>
    <div class="inputbar">
      <textarea id="text" placeholder="ここに表示したい文字を入力"></textarea>

      <select id="font" aria-label="フォント選択" title="フォント選択">
        <option value="inherit">デフォルト</option>
        <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
        <option value="'Zen Kaku Gothic New', sans-serif">Zen Kaku Gothic New</option>
        <option value="'M PLUS 1p', sans-serif">M PLUS 1p</option>
        <option value="'Noto Serif JP', serif">Noto Serif JP</option>
        <option value="'Roboto Mono', ui-monospace, monospace">Roboto Mono</option>
      </select>
    </div>

    <div class="output-wrap">
      <div id="output">　</div>
    </div>
  </main>

  <script>
    // --- Theme toggle（他ページと同じ想定） ---
    const themeBtn = document.getElementById("theme");
    const body = document.body;

    const applyTheme = (dark) => {
      body.classList.toggle("dark", dark);
      themeBtn.className = dark ? "fa-regular fa-sun" : "fa-regular fa-moon";
    };

    const storedTheme = localStorage.getItem("theme");
    if (storedTheme === "dark" || storedTheme === "light") {
      applyTheme(storedTheme === "dark");
    } else {
      applyTheme(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    }

    themeBtn.addEventListener("click", () => {
      const nextDark = !body.classList.contains("dark");
      applyTheme(nextDark);
      localStorage.setItem("theme", nextDark ? "dark" : "light");
    });

    // --- 入力 → 出力（即反映） ---
    const text = document.getElementById("text");
    const output = document.getElementById("output");

    const sync = () => {
      output.textContent = text.value.length ? text.value : "　";
    };
    text.addEventListener("input", sync);
    sync();

    // --- フォント選択（出力だけ変更・保存） ---
    const fontSel = document.getElementById("font");
    const FONT_KEY = "larger_output_font";

    const applyFont = (value) => {
      document.documentElement.style.setProperty("--output-font", value);
    };

    const savedFont = localStorage.getItem(FONT_KEY);
    if (savedFont) {
      fontSel.value = savedFont;
      applyFont(savedFont);
    } else {
      applyFont(fontSel.value);
    }

    fontSel.addEventListener("change", () => {
      localStorage.setItem(FONT_KEY, fontSel.value);
      applyFont(fontSel.value);
    });
  </script>
</body>
</html>
