<!doctype html>
<html lang="ja">

    <head>
        <meta charset="utf-8"/>
        <meta name="description" content="個人的に作ったMinecraftのコマンドツール等">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>コマンド拡大表示</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/style.css">

        <style>
            body {
                max-width: none;
            }

            #command {
                border: 1px solid #000;
                border-radius: 6px;
                width: 100%;
                height: 50px;
                resize: none;
                padding: 12px 20px;
            }
            
            #font {
    align-self: flex-end;

    margin: 8px 0 8px auto;
    padding: 6px 10px;

    height: 36px;
    font-size: 14px;

    border-radius: 6px;
    cursor: pointer;
}
            </style>
    </head>

    <body>
        <header>
            <h1>コマンド拡大表示</h1>
            <div class="icons">
                <i onClick="darkmode()" title="ダークモード切替" class="fa-solid fa-circle-half-stroke"></i>
                <a href="index.html"><i class="fa-solid fa-house"></i></a>
            </div>
        </header>

        <textarea id="command" placeholder="拡大表示するコマンドを入力" spellcheck="false"></textarea>

        <select id="font" aria-label="フォント選択" title="フォント選択">
            <option value="inherit">デフォルト</option>
            <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
        </select>

        <textarea readonly id="output" placeholder="ここにコマンドが表示されます" spellcheck="false"></textarea>
        wip
        <script src="js/script.js"></script>
        <script>
            const command = document.getElementById("command");
            const output = document.getElementById("output");

            function disp() {
                output.value = command.value;
            }
            command.addEventListener("input", disp);
        </script>
    </body>
</html>
