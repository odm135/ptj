<!doctype html>
<html lang="ja">

    <head>
        <meta charset="utf-8"/>
        <meta name="description" content="個人的に作ったMinecraftのコマンドツール等">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ツール一覧</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/style.css">

        <style>
            .ganre {
                border: 1.5px solid #181818;
                border-radius: 12px;
                margin: 30px;
                padding: 30px;
                background-color: #FFFFFF;
            }

            body.dark .ganre {
                border-color: #F8F8F8;
                background-color: #1F1F1F;
            }

            h2 {
                margin-bottom: 15px;
            }

            body.dark h2 {
                color: #FFF;
            }

            ul {
                margin-left: 30px;
            }

            li {
                margin-bottom: 10px;
            }

            a {
                position: relative;
                padding-bottom: 3px;
            }

            a::before {
                content: "";
                position: absolute;
                left: 0;
                bottom: 0;
                width: 0;
                height: 1px;
                background-color: #181818;
                transition: width 0.4s ease;
            }
            body.dark a::before {
                background-color: #C2C2C2;
            }

            a:hover::before {
                width: 100%;
            }
        </style>
    </head>

    <body>
        <header>
            <h1>ツール一覧</h1>
            <div class="icons">
                <i onClick="darkmode()" title="ダークモード切替" class="fa-solid fa-circle-half-stroke"></i>
                <a href="index.html"><i class="fa-solid fa-house"></i></a>
            </div>
        </header>

        <div class="ganre">
            <h2>便利系</h2>
            <ul>
                <li><a href="larger.html">コマンド拡大表示(wip)</a> / 入力したコマンドを見やすく大きく表示する</li>
                <li><a href="">仮表示</a></li>
                <li><a href="">仮表示</a></li>
            </ul>
        </div>

        <div class="ganre">
            <h2>Minecraftコマンド系</h2>
            <ul>
                <li><a href="circle.html">円形設置コマンドジェネレーター</a> / ブロックを円状に設置するコマンドジェネレーター</li>
                <li><a href="">仮表示</a></li>
                <li><a href="">仮表示</a></li>
            </ul>
        </div>
        
        <script src="js/script.js"></script>
    </body>
</html>
