<!doctype html>
<html lang="ja">

    <head>
        <meta charset="utf-8">
        <meta name="description" content="個人的に作ったMinecraftのコマンドツール等">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ツール一覧</title>
        <link rel="icon" href="img/favicon.svg" type="image/svg+xml">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/style.css">

        <style>
            .ganre {
                border: 1.5px solid #181818;
                border-radius: 12px;
                margin: 30px;
                padding: 30px;
                background-color: #FFFFFF;
            }

            body.dark .ganre {
                border-color: #F8F8F8;
                background-color: #1F1F1F;
            }

            h2 {
                margin-bottom: 15px;
            }

            body.dark h2 {
                color: #FFF;
            }

            ul {
                margin-left: 30px;
            }

            li {
                margin-bottom: 10px;
            }

            .about {
                margin-bottom: 30px;
                color: #C2C2C2;
            }

            .page {
                position: relative;
                padding-bottom: 3px;
            }

            .page::before {
                content: "";
                position: absolute;
                left: 0;
                bottom: 0;
                width: 0;
                height: 1px;
                background-color: #181818;
                transition: width 0.4s ease;
            }
            body.dark .page::before {
                background-color: #C2C2C2;
            }

            .page:hover::before {
                width: 100%;
            }
        </style>
    </head>

    <body class="bg-base">
        <header>
            <h1>ツール一覧</h1>
            <div class="icons">
                <button onClick="darkmode()" class="icon" title="ダークモード切替"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <a href="index.html" class="icon"><i class="fa-solid fa-house"></i></a>
            </div>
        </header>

        <div class="ganre">
            <h2>便利系</h2>
            <ul>
                <li><a href="larger.html" class="page">コマンド拡大表示</a></li>
                <p class="about">入力されたテキストをウィンドウ全体に拡大表示するためのツールです。</p>

                <li><a href="" class="page">仮表示</a></li>
                <p class="about">ページ説明</p>

                <li><a href="" class="page">仮表示</a></li>
                <p class="about">ページ説明</p>
            </ul>
        </div>

        <div class="ganre">
            <h2>Minecraftコマンド系</h2>
            <ul>
                <li><a href="circle.html" class="page">円形設置コマンドジェネレーター</a></li>
                <p class="about">指定された半径とブロックIDに基づき、円形にブロックを配置するfunctionコマンドを生成します。</p>

                <li><a href="sound.html" class="page">BGMコマンドジェネレーター</a></li>
                <p class="about">ピアノロール形式のUIで音符を配置し、選択したサウンドを演奏するコマンドを生成します。</p>

                <li><a href="" class="page">仮表示</a></li>
                <p class="about">ページ説明</p>
            </ul>
        </div>
        
        <script src="js/script.js"></script>
    </body>
</html>
